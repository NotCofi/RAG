[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nikla", email = "niklasrauahal@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.3",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pypdf>=6.19.0",
    "retrievers>=0.1.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
